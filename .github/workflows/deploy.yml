name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
            -e "set ftp:passive-mode yes; \
                set net:timeout 30; \
                set net:max-retries 3; \
                mirror -R --delete \
                  --exclude '^\.git' \
                  --exclude '^\.github' \
                  ./ /nervensystem-check/; \
                quit" \
            ftp://${{ secrets.FTP_SERVER }}
